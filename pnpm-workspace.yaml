packages:
  - "apps/*"
  - "packages/*"
  - "tools/worker-tests"
allowBuilds:
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.8.4"
  - "wrangler@4.164.0"
  - "@cloudflare/workers-types@5.20261117.1"
  - "cloudflare-drizzle-tracing@1.2.0"
  - "@cloudflare/workerd-darwin-64@1.20261117.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261117.1"
  - "@cloudflare/workerd-linux-64@1.20261117.1"
  - "@cloudflare/workerd-linux-arm64@1.20261117.1"
  - "@cloudflare/workerd-windows-64@1.20261117.1"
  - "@tanstack/query-core@5.108.0"
  - "@tanstack/react-query@5.108.0"
  - "lucide-react@1.74.0"
  - "miniflare@5.20261117.0-beta"
  - "openai@7.58.0"
  - "react-email@6.11.16"
  - "workerd@1.20261117.1"
  - "@tanstack/ai-cloudflare@1.2.1"
  - "@tanstack/ai@1.5.0"
# Alchemy uses service identities across packages. Resolve its optional WebSocket
# peer consistently in the application, stack, and test runner.
overrides:
  "alchemy>ws": "8.23.0"
patchedDependencies:
  "@alchemy.run/cloudflare@2.0.0-beta.87": patches/@alchemy.run__cloudflare@2.0.0-beta.87.patch
  cloudflare-drizzle-tracing@1.2.0: patches/cloudflare-drizzle-tracing@1.2.0.patch
