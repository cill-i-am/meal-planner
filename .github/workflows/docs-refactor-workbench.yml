name: Documentation refactor workbench

on:
  push:
    branches: [codex/documentation-refactor-workbench-20260920]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export planning records without changing their branches
        run: |
          mkdir -p planning-sources
          for pr in 219 220 221 222 223 224 225; do
            git fetch --no-tags origin "pull/$pr/head"
            git rev-parse FETCH_HEAD > "planning-sources/$pr.sha"
            git archive --format=tar --output="planning-sources/$pr.tar" FETCH_HEAD docs/delivery/library-consolidation
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docs-refactor-planning-sources
          path: planning-sources/
          retention-days: 1
