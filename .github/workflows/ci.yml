name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ vars.ALCHEMY_DEPLOYMENTS_ENABLED != 'true' }}

jobs:
  changes:
    name: Classify container changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      containers: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.containers }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify changes requiring container and native stack checks
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            containers:
              - '.github/workflows/**'
              - 'alchemy.run.ts'
              - 'apps/api/**'
              - 'apps/web/package.json'
              - 'apps/web/tsconfig*.json'
              - 'apps/web/vite.config.ts'
              - 'apps/web/website-*.ts'
              - 'apps/web/scripts/**'
              - 'apps/web/src/worker.ts'
              - 'apps/web/src/features/api-client/**'
              - 'packages/**'
              - 'patches/**'
              - 'scripts/**'
              - 'stacks/**'
              - 'tools/worker-tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig*.json'
              - 'vitest*.ts'

  quality:
    name: Quality
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation and instruction routes
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_docs_check.py'
          python3 scripts/check-docs.py

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Check Ultracite setup
        run: pnpm exec ultracite doctor

  tests:
    name: Tests (${{ matrix.name }})
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infrastructure
            command: pnpm exec vitest run --config vitest.alchemy.config.ts
            browser: false
          - name: api-and-packages
            command: pnpm --recursive --filter './packages/**' --filter '@meal-planner/api' test
            browser: false
          - name: frontend
            command: pnpm --filter @meal-planner/web test
            browser: true
          - name: native-workers
            command: pnpm --filter @meal-planner/worker-tests test
            browser: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.browser
        run: pnpm --filter @meal-planner/web exec playwright install --with-deps chromium
      - name: Run tests
        run: ${{ matrix.command }}
      - name: Retain frontend failure evidence
        if: failure() && matrix.browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-failures
          path: apps/web/.vitest-attachments
          retention-days: 3

  media-container:
    name: Media container (${{ matrix.suite }})
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [import-media-container, import-media-lifecycle]
    env:
      MEAL_PLANNER_RUN_CONTAINER_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify media container
        run: pnpm --filter @meal-planner/api exec vitest run --config vitest.container.config.ts src/features/imports/${{ matrix.suite }}.integration.ts
      - name: Verify native Alchemy stack locally
        if: matrix.suite == 'import-media-container'
        run: pnpm test:stack
      - name: Retain native runtime failure evidence
        if: failure() && matrix.suite == 'import-media-container'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-stack-logs
          path: .alchemy/log
          retention-days: 3

  auth-family-e2e:
    name: Auth and family browser journeys
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and WebKit
        run: pnpm --filter @meal-planner/web exec playwright install --with-deps chromium webkit

      - name: Test auth and family journeys against local Workers
        run: pnpm --filter @meal-planner/web test:e2e

      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-family-browser-traces
          path: apps/web/test-results
          retention-days: 3

  deploy:
    name: Deploy Alchemy
    needs: [changes, quality, tests, media-container, auth-family-e2e]
    if: >-
      !cancelled() && !failure() && vars.ALCHEMY_DEPLOYMENTS_ENABLED == 'true' && github.event.action != 'closed' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CEIRD_ZONE_ID: ${{ vars.CEIRD_ZONE_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      MEAL_PLANNER_IMPORT_API_TOKEN: ${{ secrets.MEAL_PLANNER_IMPORT_API_TOKEN }}
      MEAL_PLANNER_IMPORT_ACTOR_ID: ${{ secrets.MEAL_PLANNER_IMPORT_ACTOR_ID }}
      MEAL_PLANNER_IMPORT_HOUSEHOLD_SCOPE_ID: ${{ secrets.MEAL_PLANNER_IMPORT_HOUSEHOLD_SCOPE_ID }}
      MEAL_PLANNER_PRIVATE_DISCOVERY_CONFIG: ${{ secrets.MEAL_PLANNER_PRIVATE_DISCOVERY_CONFIG }}
      MEAL_PLANNER_EMAIL_DELIVERY_ENABLED: "false"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check native provider configuration
        run: pnpm exec alchemy provider check-env --provider Cloudflare --provider GitHub
      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: pnpm exec alchemy deploy --stage prod --profile ci --yes
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        env:
          ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: pnpm exec alchemy deploy --stage "$ALCHEMY_STAGE" --profile ci --yes

  cleanup:
    name: Destroy PR preview
    if: >-
      vars.ALCHEMY_DEPLOYMENTS_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      MEAL_PLANNER_IMPORT_API_TOKEN: ${{ secrets.MEAL_PLANNER_IMPORT_API_TOKEN }}
      MEAL_PLANNER_IMPORT_ACTOR_ID: ${{ secrets.MEAL_PLANNER_IMPORT_ACTOR_ID }}
      MEAL_PLANNER_IMPORT_HOUSEHOLD_SCOPE_ID: ${{ secrets.MEAL_PLANNER_IMPORT_HOUSEHOLD_SCOPE_ID }}
      MEAL_PLANNER_PRIVATE_DISCOVERY_CONFIG: ${{ secrets.MEAL_PLANNER_PRIVATE_DISCOVERY_CONFIG }}
      MEAL_PLANNER_EMAIL_DELIVERY_ENABLED: "false"
    steps:
      - name: Check out the current stack definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Destroy preview
        run: pnpm exec alchemy destroy --stage "$ALCHEMY_STAGE" --profile ci --yes
