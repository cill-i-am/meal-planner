name: Plain English editing workspace

on:
  push:
    branches: [codex/plain-english-workbench-20260920]
    paths: [.github/workflows/plain-english-workbench.yml]

permissions:
  contents: write

jobs:
  publish-reviewed-writing:
    if: github.repository == 'cill-i-am/meal-planner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the repository-pinned tools
        run: pnpm install --frozen-lockfile
      - name: Verify the reviewed edits and publish objects on the workbench only
        run: python3 .plain-english-transfer/apply.py
      - uses: actions/upload-artifact@v4
        with:
          name: plain-writing-results
          path: ${{ runner.temp }}/plain-writing-results/results.json
          retention-days: 1
          if-no-files-found: error
