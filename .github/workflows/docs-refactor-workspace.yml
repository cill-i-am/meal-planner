name: Documentation refactor workspace

on:
  push:
    branches: [codex/unified-docs-intent-20260920]
    paths: [.github/workflows/docs-refactor-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'cill-i-am/meal-planner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1912513fefd35c009c09168035b9c0e0b872c1fb
          persist-credentials: false
      - name: Archive the reviewed baseline without running project code
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/meal-planner-baseline.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-refactor-baseline
          path: ${{ runner.temp }}/meal-planner-baseline.tar
          retention-days: 1
